<svg xmlns="http://www.w3.org/2000/svg" width="900" height="706" viewBox="0 0 900 706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>Phone Link, KDE Connect on Mac and GlassLink compared</title>
<rect x="686" y="6" width="200" height="694" rx="20" fill="#ffffff"/>
<text x="410" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#f0f6fc">Phone Link</text>
<text x="590" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#f0f6fc">KDE Connect on Mac</text>
